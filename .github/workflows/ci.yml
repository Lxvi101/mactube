name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  native:
    name: Native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint
        run: cargo +stable clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +stable test --manifest-path src-tauri/Cargo.toml --locked
